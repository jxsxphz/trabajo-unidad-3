{% extends "base.html" %}

{% block titulo %}Ejercicio 1{% endblock %}

{% block contenido %}
    <h1>Formulario de Notas</h1>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" name="nota1" min="10" max="70" step="any" value="{{ valores.get('nota1', '') }}" required>

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" name="nota2" min="10" max="70" step="any" value="{{ valores.get('nota2', '') }}" required>

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" name="nota3" min="10" max="70" step="any" value="{{ valores.get('nota3', '') }}" required>

        <label for="asistencia">Asistencia (%):</label>
        <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any" value="{{ valores.get('asistencia', '') }}" required>

        <button type="submit" class="boton">Enviar</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if promedio is not none %}
        <p class="resultado">{{ promedio }}</p>
        <p class="resultado estado {{ 'aprobado' if estado == 'APROBADO' else 'reprobado' }}">{{ estado }}</p>
    {% endif %}

    <a class="volver" href="{{ url_for('inicio') }}">Volver al menu</a>
{% endblock %}

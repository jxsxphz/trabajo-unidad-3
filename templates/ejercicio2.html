{% extends "base.html" %}

{% block titulo %}Ejercicio 2{% endblock %}

{% block contenido %}
    <form method="POST" action="{{ url_for('ejercicio2') }}" class="centrado">
        <label for="nombre1">Nombre 1:</label>
        <input type="text" id="nombre1" name="nombre1" value="{{ valores.get('nombre1', '') }}" required>

        <label for="nombre2">Nombre 2:</label>
        <input type="text" id="nombre2" name="nombre2" value="{{ valores.get('nombre2', '') }}" required>

        <label for="nombre3">Nombre 3:</label>
        <input type="text" id="nombre3" name="nombre3" value="{{ valores.get('nombre3', '') }}" required>

        <button type="submit" class="boton">Enviar</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if nombre %}
        <p class="resultado centrado">El nombre con mayor cantidad de caracteres es : {{ nombre }}</p>
        <p class="resultado centrado">El nombre tiene : {{ cantidad }} caracteres</p>
    {% endif %}

    <a class="volver" href="{{ url_for('inicio') }}">Volver al menu</a>
{% endblock %}
